kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["python3", "-c", "import fastapi, uvicorn, sqlalchemy, asyncpg; print('python deps ok')"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["python3", "-m", "uvicorn", "app.main:app", "--app-dir", "artifacts/api-server", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

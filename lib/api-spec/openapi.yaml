openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PromptFolio API (served by the Python FastAPI backend)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: catalog
  - name: agents
  - name: builder
  - name: delivery
  - name: references
  - name: settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------- AUTH ----------------
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Current session (never 401; returns authenticated=false when logged out)
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
  /auth/demo-login:
    post:
      operationId: demoLogin
      tags: [auth]
      summary: Local demo login (used while Google OAuth credentials are not configured)
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/preferences:
    patch:
      operationId: updatePreferences
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ---------------- DASHBOARD ----------------
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ---------------- CATEGORIES ----------------
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{id}:
    delete:
      operationId: deleteCategory
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------------- PROMPTS (CATALOG) ----------------
  /prompts:
    get:
      operationId: listPrompts
      tags: [catalog]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: categoryId, in: query, required: false, schema: { type: string } }
        - { name: modality, in: query, required: false, schema: { $ref: "#/components/schemas/Modality" } }
        - { name: tag, in: query, required: false, schema: { type: string } }
        - { name: folder, in: query, required: false, schema: { type: string } }
        - { name: publishedOnly, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
  /prompts/facets:
    get:
      operationId: getPromptFacets
      tags: [catalog]
      responses:
        "200":
          description: Available folders, tags and modality counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptFacets"
  /prompts/export:
    get:
      operationId: exportPrompts
      tags: [catalog]
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, markdown]
      responses:
        "200":
          description: Export bundle (file content as text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportBundle"
  /prompts/import:
    post:
      operationId: importPrompts
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /prompts/suggest-variables:
    post:
      operationId: suggestPromptVariables
      tags: [catalog]
      summary: AI-written purpose, examples and required flag for every variable of a template (not saved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestVariablesInput"
      responses:
        "200":
          description: Documented variables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestVariablesResult"
  /prompts/backup:
    post:
      operationId: backupPromptsToCloud
      tags: [catalog]
      summary: Upload a JSON backup of the collection to the active storage provider
      responses:
        "200":
          description: Backup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupResult"
  /prompts/{id}:
    get:
      operationId: getPrompt
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
    patch:
      operationId: updatePrompt
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptUpdate"
      responses:
        "200":
          description: Updated (version is incremented when the template changes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
    delete:
      operationId: deletePrompt
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------------- AGENTS ----------------
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgentRole"
      responses:
        "200":
          description: Agents (system defaults + user agents)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{id}:
    patch:
      operationId: updateAgent
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------------- BUILDER ----------------
  /builder/sessions:
    get:
      operationId: listBuilderSessions
      tags: [builder]
      parameters:
        - name: workspaceType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/BuilderWorkspaceType"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
    post:
      operationId: createBuilderSession
      tags: [builder]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionInput"
      responses:
        "201":
          description: Created (agent not yet locked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
  /builder/sessions/{id}:
    get:
      operationId: getBuilderSession
      tags: [builder]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionDetail"
    delete:
      operationId: deleteBuilderSession
      tags: [builder]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /builder/sessions/{id}/messages:
    post:
      operationId: sendBuilderMessage
      tags: [builder]
      summary: >
        Send a message. On the first message agentId is required and becomes the
        permanently locked agent. Later messages ignore agentId; a different agentId returns 409.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Exchange result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatExchange"
  /builder/sessions/{id}/draft:
    get:
      operationId: getPublishDraft
      tags: [builder]
      summary: Pre-filled values for the Save & Publish final review card
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishDraft"
  /builder/sessions/{id}/publish:
    post:
      operationId: publishFromSession
      tags: [builder]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishInput"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"

  # ---------------- DELIVERY ----------------
  /delivery/capabilities:
    get:
      operationId: getDeliveryCapabilities
      tags: [delivery]
      summary: Which generation engines are available for each modality
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModalityCapability"
  /delivery/execute:
    post:
      operationId: executeDelivery
      tags: [delivery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteInput"
      responses:
        "200":
          description: Generated asset (auto-saved to active storage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedAsset"
  /delivery/assets:
    get:
      operationId: listAssets
      tags: [delivery]
      parameters:
        - { name: modality, in: query, required: false, schema: { $ref: "#/components/schemas/Modality" } }
        - { name: promptId, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Assets, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedAsset"
  /delivery/assets/{id}:
    delete:
      operationId: deleteAsset
      tags: [delivery]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------------- BRAND REFERENCES (referencia_marca_anexa) ----------------
  /references:
    get:
      operationId: listReferences
      tags: [references]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [recent, lastUsed, size, code] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Library images of the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceImage"
    post:
      operationId: uploadReference
      tags: [references]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceUploadInput"
      responses:
        "200":
          description: Stored image (or the existing one when the same bytes were already uploaded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceImage"
  /references/stats:
    get:
      operationId: getReferenceStats
      tags: [references]
      responses:
        "200":
          description: Library usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceStats"
  /references/settings:
    put:
      operationId: updateReferenceSettings
      tags: [references]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceSettingsInput"
      responses:
        "200":
          description: Updated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceStats"
  /references/cleanup:
    post:
      operationId: cleanupReferences
      tags: [references]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceCleanupInput"
      responses:
        "200":
          description: Images matched (dryRun) or permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDeleteResult"
  /references/bulk-delete:
    post:
      operationId: bulkDeleteReferences
      tags: [references]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceBulkDeleteInput"
      responses:
        "200":
          description: Permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDeleteResult"
  /references/{id}:
    patch:
      operationId: renameReference
      tags: [references]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceUpdateInput"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceImage"
    delete:
      operationId: deleteReference
      tags: [references]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Permanently deleted from the app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceDeleteResult"

  # ---------------- SETTINGS: MCP ----------------
  /settings/mcp:
    get:
      operationId: listMcpConnections
      tags: [settings]
      responses:
        "200":
          description: Connections (credentials never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpConnection"
    post:
      operationId: createMcpConnection
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpConnectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpConnection"
  /settings/mcp/{id}:
    patch:
      operationId: updateMcpConnection
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpConnectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpConnection"
    delete:
      operationId: deleteMcpConnection
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /settings/mcp/{id}/test:
    post:
      operationId: testMcpConnection
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"

  # ---------------- SETTINGS: STORAGE ----------------
  /settings/storage:
    get:
      operationId: getStorageOverview
      tags: [settings]
      responses:
        "200":
          description: All three storage providers and which one is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageOverview"
  /settings/storage/active:
    put:
      operationId: setActiveStorage
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveStorageInput"
      responses:
        "200":
          description: Updated overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageOverview"
  /settings/storage/{provider}:
    put:
      operationId: saveStorageConfig
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/ProviderParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageConfigInput"
      responses:
        "200":
          description: Updated overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageOverview"
  /settings/storage/{provider}/test:
    post:
      operationId: testStorageConnection
      tags: [settings]
      summary: Test connection AND a real write (uploads a small test file)
      parameters:
        - $ref: "#/components/parameters/ProviderParam"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProviderParam:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StorageProvider"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    # ---------- enums ----------
    Modality:
      type: string
      enum: [image, video, audio, text]
    StorageProvider:
      type: string
      enum: [google_drive_mcp, cloudflare_r2, aws_s3]
    AgentRole:
      type: string
      enum: [meta_agent_builder, prompt_builder, delivery_executor]
    BuilderWorkspaceType:
      type: string
      enum: [builder_agent, builder_prompt]
    McpProviderType:
      type: string
      enum: [google_nano_banana, openai_chatgpt, runway, custom_mcp]
    McpConnectionType:
      type: string
      enum: [api_key, mcp_sse]
    Language:
      type: string
      enum: [pt-BR, en-US]
    Theme:
      type: string
      enum: [light, dark]

    # ---------- auth ----------
    User:
      type: object
      required: [id, email, name, language, theme, activeStorageProvider, isDemo, googleDriveLinked, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        language: { $ref: "#/components/schemas/Language" }
        theme: { $ref: "#/components/schemas/Theme" }
        activeStorageProvider: { $ref: "#/components/schemas/StorageProvider" }
        isDemo: { type: boolean }
        googleDriveLinked:
          type: boolean
          description: True when a real Google OAuth token with drive.file scope is stored
        createdAt: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [authenticated, googleOAuthConfigured, googleLoginUrl, demoLoginEnabled, builtinAiAvailable]
      properties:
        authenticated: { type: boolean }
        demoLoginEnabled:
          type: boolean
          description: Whether the shared "Local Demo Login" account is available (off in production)
        builtinAiAvailable:
          type: boolean
          description: Whether a platform AI engine exists as fallback (Replit development only); otherwise every user needs their own keys
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        googleOAuthConfigured:
          type: boolean
          description: Whether real Google sign-in (and Drive) is configured on the server
        googleLoginUrl:
          type: string
          description: Full-page navigation target to start Google OAuth (e.g. /api/auth/google/login)
    PreferencesUpdate:
      type: object
      properties:
        language: { $ref: "#/components/schemas/Language" }
        theme: { $ref: "#/components/schemas/Theme" }

    # ---------- dashboard ----------
    ModalityCount:
      type: object
      required: [modality, count]
      properties:
        modality: { $ref: "#/components/schemas/Modality" }
        count: { type: integer }
    DashboardSummary:
      type: object
      required: [totalPrompts, publishedPrompts, totalAgents, customAgents, builderSessions, totalAssets, assetsByModality, promptsByModality, activeStorageProvider, activeMcpConnections]
      properties:
        totalPrompts: { type: integer }
        publishedPrompts: { type: integer }
        totalAgents: { type: integer }
        customAgents: { type: integer }
        builderSessions: { type: integer }
        totalAssets: { type: integer }
        assetsByModality:
          type: array
          items: { $ref: "#/components/schemas/ModalityCount" }
        promptsByModality:
          type: array
          items: { $ref: "#/components/schemas/ModalityCount" }
        activeStorageProvider: { $ref: "#/components/schemas/StorageProvider" }
        activeMcpConnections: { type: integer }
    ActivityItem:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [prompt_published, agent_published, asset_generated, session_started]
        title: { type: string }
        modality:
          oneOf:
            - $ref: "#/components/schemas/Modality"
            - type: "null"
        storageProvider:
          oneOf:
            - $ref: "#/components/schemas/StorageProvider"
            - type: "null"
        createdAt: { type: string, format: date-time }

    # ---------- categories ----------
    Category:
      type: object
      required: [id, name, slug, color, modalityScope, promptCount]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        color: { type: string }
        modalityScope:
          type: string
          enum: [all, image, video, audio, text]
        promptCount: { type: integer }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
        modalityScope:
          type: string
          enum: [all, image, video, audio, text]

    # ---------- prompts ----------
    PromptVariable:
      type: object
      required: [name]
      properties:
        name: { type: string }
        label: { type: ["string", "null"] }
        defaultValue: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        helpText: { type: ["string", "null"] }
        examples:
          type: array
          items: { type: string }
        options:
          type: array
          items: { type: string }
        required: { type: boolean }
    SuggestVariablesInput:
      type: object
      required: [promptTemplate]
      properties:
        promptTemplate: { type: string }
        variables:
          type: array
          items: { $ref: "#/components/schemas/PromptVariable" }
    SuggestVariablesResult:
      type: object
      required: [variables]
      properties:
        variables:
          type: array
          items: { $ref: "#/components/schemas/PromptVariable" }
    AssetThumb:
      type: object
      required: [id, modality, previewUrl]
      properties:
        id: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        previewUrl: { type: string }
    Prompt:
      type: object
      required: [id, title, promptTemplate, variables, tags, targetModality, isPublished, version, recentAssets, assetCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        promptTemplate: { type: string }
        variables:
          type: array
          items: { $ref: "#/components/schemas/PromptVariable" }
        tags:
          type: array
          items: { type: string }
        folder: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        categoryName: { type: ["string", "null"] }
        categoryColor: { type: ["string", "null"] }
        targetModality: { $ref: "#/components/schemas/Modality" }
        preferredMcpId: { type: ["string", "null"] }
        preferredMcpName: { type: ["string", "null"] }
        sourceAgentName: { type: ["string", "null"] }
        isPublished: { type: boolean }
        version: { type: integer }
        recentAssets:
          type: array
          items: { $ref: "#/components/schemas/AssetThumb" }
        assetCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PromptUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        promptTemplate: { type: string, minLength: 1 }
        variables:
          type: array
          items: { $ref: "#/components/schemas/PromptVariable" }
        tags:
          type: array
          items: { type: string }
        folder: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        targetModality: { $ref: "#/components/schemas/Modality" }
        preferredMcpId: { type: ["string", "null"] }
        isPublished: { type: boolean }
    PromptFacets:
      type: object
      required: [folders, tags, modalityCounts]
      properties:
        folders:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        modalityCounts:
          type: array
          items: { $ref: "#/components/schemas/ModalityCount" }
    ExportBundle:
      type: object
      required: [filename, mimeType, content, count]
      properties:
        filename: { type: string }
        mimeType: { type: string }
        content: { type: string }
        count: { type: integer }
    ImportInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: JSON text previously produced by the JSON export
    ImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
    BackupResult:
      type: object
      required: [provider, status, filename]
      properties:
        provider: { $ref: "#/components/schemas/StorageProvider" }
        status: { $ref: "#/components/schemas/StorageStatus" }
        filename: { type: string }
        remoteViewUrl: { type: ["string", "null"] }
        message: { type: ["string", "null"] }

    # ---------- agents ----------
    Agent:
      type: object
      required: [id, name, agentRole, systemPrompt, isSystemDefault, isPublished, isActive, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        agentRole: { $ref: "#/components/schemas/AgentRole" }
        systemPrompt: { type: string }
        categoryId: { type: ["string", "null"] }
        categoryName: { type: ["string", "null"] }
        preferredMcpId: { type: ["string", "null"] }
        temperature: { type: number }
        isSystemDefault: { type: boolean }
        isPublished: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    AgentInput:
      type: object
      required: [name, agentRole, systemPrompt]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        agentRole: { $ref: "#/components/schemas/AgentRole" }
        systemPrompt: { type: string, minLength: 1 }
        categoryId: { type: ["string", "null"] }
        preferredMcpId: { type: ["string", "null"] }
        temperature: { type: number }
    AgentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        systemPrompt: { type: string, minLength: 1 }
        categoryId: { type: ["string", "null"] }
        preferredMcpId: { type: ["string", "null"] }
        temperature: { type: number }
        isActive: { type: boolean }
        isPublished: { type: boolean }

    # ---------- builder ----------
    ChatSession:
      type: object
      required: [id, workspaceType, title, isLocked, messageCount, createdAt]
      properties:
        id: { type: string }
        workspaceType: { $ref: "#/components/schemas/BuilderWorkspaceType" }
        title: { type: string }
        lockedAgentId: { type: ["string", "null"] }
        lockedAgentName: { type: ["string", "null"] }
        isLocked: { type: boolean }
        messageCount: { type: integer }
        publishedPromptId: { type: ["string", "null"] }
        publishedAgentId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ChatSessionInput:
      type: object
      required: [workspaceType]
      properties:
        workspaceType: { $ref: "#/components/schemas/BuilderWorkspaceType" }
        title: { type: string }
    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        createdAt: { type: string, format: date-time }
    ChatSessionDetail:
      type: object
      required: [session, messages]
      properties:
        session: { $ref: "#/components/schemas/ChatSession" }
        lockedAgent:
          oneOf:
            - $ref: "#/components/schemas/Agent"
            - type: "null"
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
    ChatMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        agentId:
          type: ["string", "null"]
          description: Required only for the first message of a session
    ChatExchange:
      type: object
      required: [session, userMessage, assistantMessage]
      properties:
        session: { $ref: "#/components/schemas/ChatSession" }
        userMessage: { $ref: "#/components/schemas/ChatMessage" }
        assistantMessage: { $ref: "#/components/schemas/ChatMessage" }
    PublishDraft:
      type: object
      required: [kind, title, content, variables, tags, targetModality]
      properties:
        kind:
          type: string
          enum: [prompt, agent]
        title: { type: string }
        description: { type: ["string", "null"] }
        content:
          type: string
          description: Consolidated text (prompt template or agent system prompt)
        variables:
          type: array
          items: { $ref: "#/components/schemas/PromptVariable" }
        tags:
          type: array
          items: { type: string }
        targetModality: { $ref: "#/components/schemas/Modality" }
        suggestedMcpProvider:
          oneOf:
            - $ref: "#/components/schemas/McpProviderType"
            - type: "null"
    PublishInput:
      type: object
      required: [kind, title, content]
      properties:
        kind:
          type: string
          enum: [prompt, agent]
        title: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        content: { type: string, minLength: 1 }
        categoryId: { type: ["string", "null"] }
        folder: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        variables:
          type: array
          items: { $ref: "#/components/schemas/PromptVariable" }
        targetModality: { $ref: "#/components/schemas/Modality" }
        preferredMcpId: { type: ["string", "null"] }
        agentRole: { $ref: "#/components/schemas/AgentRole" }
    PublishResult:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [prompt, agent]
        prompt:
          oneOf:
            - $ref: "#/components/schemas/Prompt"
            - type: "null"
        agent:
          oneOf:
            - $ref: "#/components/schemas/Agent"
            - type: "null"

    # ---------- delivery ----------
    EngineOption:
      type: object
      required: [id, label, source, available]
      properties:
        id:
          type: string
          description: "'builtin' or an MCP connection id"
        label: { type: string }
        source:
          type: string
          enum: [builtin, mcp]
        providerType:
          oneOf:
            - $ref: "#/components/schemas/McpProviderType"
            - type: "null"
        available: { type: boolean }
        reason: { type: ["string", "null"] }
    ModalityCapability:
      type: object
      required: [modality, engines]
      properties:
        modality: { $ref: "#/components/schemas/Modality" }
        engines:
          type: array
          items: { $ref: "#/components/schemas/EngineOption" }
    ExecuteInput:
      type: object
      required: [promptId, modality]
      properties:
        promptId: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        variables:
          type: object
          additionalProperties: { type: string }
        engineId:
          type: ["string", "null"]
          description: "'builtin' or an MCP connection id; null = automatic choice"
        aspectRatio:
          type: string
          enum: ["1:1", "16:9", "9:16"]
        durationSeconds: { type: integer }
        voice: { type: string }
        extraInstructions: { type: ["string", "null"] }
        brandReferences:
          type: array
          maxItems: 4
          description: Value of the {{referencia_marca_anexa}} field
          items: { $ref: "#/components/schemas/BrandReferenceInput" }
    BrandReferenceInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [url, library] }
        url: { type: ["string", "null"], description: "Public image URL (kind=url, not stored)" }
        referenceId: { type: ["string", "null"], description: "Library image id (kind=library)" }
    ReferenceImage:
      type: object
      required: [id, code, source, mimeType, width, height, sizeBytes, useCount, createdAt, thumbUrl, fileUrl]
      properties:
        id: { type: string }
        code: { type: string, description: "Unique per user, used as @code" }
        originalName: { type: ["string", "null"] }
        source: { type: string, enum: [upload, paste] }
        mimeType: { type: string }
        width: { type: integer }
        height: { type: integer }
        sizeBytes: { type: integer }
        useCount: { type: integer }
        lastUsedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        thumbUrl: { type: string }
        fileUrl: { type: string }
        deduplicated: { type: boolean, description: "True when the upload matched an existing image" }
    ReferenceUploadInput:
      type: object
      required: [data]
      properties:
        data: { type: string, description: "Base64 or data URL of the image (max 15 MB)" }
        filename: { type: ["string", "null"] }
        code: { type: ["string", "null"] }
        source: { type: string, enum: [upload, paste] }
    ReferenceUpdateInput:
      type: object
      required: [code]
      properties:
        code: { type: string }
    ReferenceBulkDeleteInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string }
    ReferenceCleanupInput:
      type: object
      required: [unusedForDays]
      properties:
        unusedForDays: { type: integer, minimum: 0 }
        onlyNeverUsed: { type: boolean }
        dryRun: { type: boolean }
    ReferenceSettingsInput:
      type: object
      properties:
        autoCleanupDays: { type: ["integer", "null"], minimum: 7 }
    ReferenceStats:
      type: object
      required: [count, totalBytes, neverUsedCount]
      properties:
        count: { type: integer }
        totalBytes: { type: integer }
        neverUsedCount: { type: integer }
        autoCleanupDays: { type: ["integer", "null"] }
    ReferenceDeleteResult:
      type: object
      required: [count, freedBytes, dryRun]
      properties:
        count: { type: integer }
        freedBytes: { type: integer }
        dryRun: { type: boolean }
    StorageStatus:
      type: string
      enum: [saved, simulated, failed]
    GeneratedAsset:
      type: object
      required: [id, modality, finalPrompt, mimeType, fileSizeBytes, filename, previewUrl, downloadUrl, storageProviderUsed, storageStatus, engineLabel, createdAt]
      properties:
        id: { type: string }
        promptId: { type: ["string", "null"] }
        promptTitle: { type: ["string", "null"] }
        modality: { $ref: "#/components/schemas/Modality" }
        finalPrompt:
          type: string
          description: Template after variable substitution
        textContent:
          type: ["string", "null"]
          description: Markdown body for text deliveries
        mimeType: { type: string }
        fileSizeBytes: { type: integer }
        filename: { type: string }
        previewUrl:
          type: string
          description: Same-origin URL (under /api) to render the media inline
        downloadUrl:
          type: string
          description: Same-origin URL (under /api) that forces a local download
        aspectRatio: { type: ["string", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        engineLabel: { type: string }
        storageProviderUsed: { $ref: "#/components/schemas/StorageProvider" }
        storageStatus: { $ref: "#/components/schemas/StorageStatus" }
        storageMessage: { type: ["string", "null"] }
        remoteFileIdOrKey: { type: ["string", "null"] }
        remoteViewUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    # ---------- settings: mcp ----------
    McpConnection:
      type: object
      required: [id, providerType, name, connectionType, hasCredentials, isActive, createdAt]
      properties:
        id: { type: string }
        providerType: { $ref: "#/components/schemas/McpProviderType" }
        name: { type: string }
        connectionType: { $ref: "#/components/schemas/McpConnectionType" }
        endpointUrl: { type: ["string", "null"] }
        defaultModel: { type: ["string", "null"] }
        hasCredentials: { type: boolean }
        maskedKey: { type: ["string", "null"] }
        headerNames:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    McpConnectionInput:
      type: object
      required: [providerType, name, connectionType]
      properties:
        providerType: { $ref: "#/components/schemas/McpProviderType" }
        name: { type: string, minLength: 1 }
        connectionType: { $ref: "#/components/schemas/McpConnectionType" }
        endpointUrl: { type: ["string", "null"] }
        apiKey: { type: ["string", "null"] }
        headers:
          type: object
          additionalProperties: { type: string }
        defaultModel: { type: ["string", "null"] }
        isActive: { type: boolean }
    McpConnectionUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        endpointUrl: { type: ["string", "null"] }
        apiKey:
          type: ["string", "null"]
          description: Omit to keep the stored key
        headers:
          type: object
          additionalProperties: { type: string }
        defaultModel: { type: ["string", "null"] }
        isActive: { type: boolean }
    TestResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        detail: { type: ["string", "null"] }
        remoteViewUrl: { type: ["string", "null"] }

    # ---------- settings: storage ----------
    GoogleDriveStorage:
      type: object
      required: [isConfigured, linkedViaLogin, rootFolderPath, folderStructure]
      properties:
        isConfigured: { type: boolean }
        linkedViaLogin: { type: boolean }
        accountEmail: { type: ["string", "null"] }
        rootFolderPath: { type: string }
        rootFolderId: { type: ["string", "null"] }
        rootFolderUrl: { type: ["string", "null"] }
        folderStructure:
          type: array
          items: { type: string }
        customMcpEndpoint: { type: ["string", "null"] }
        isDemoSimulated: { type: boolean }
        updatedAt: { type: ["string", "null"], format: date-time }
    S3CompatibleStorage:
      type: object
      required: [isConfigured, hasAccessKey, hasSecretKey]
      properties:
        isConfigured: { type: boolean }
        endpointUrl: { type: ["string", "null"] }
        bucketName: { type: ["string", "null"] }
        region: { type: ["string", "null"] }
        publicUrlPrefix: { type: ["string", "null"] }
        hasAccessKey: { type: boolean }
        hasSecretKey: { type: boolean }
        maskedAccessKey: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"], format: date-time }
    StorageOverview:
      type: object
      required: [activeProvider, googleDrive, cloudflareR2, awsS3]
      properties:
        activeProvider: { $ref: "#/components/schemas/StorageProvider" }
        googleDrive: { $ref: "#/components/schemas/GoogleDriveStorage" }
        cloudflareR2: { $ref: "#/components/schemas/S3CompatibleStorage" }
        awsS3: { $ref: "#/components/schemas/S3CompatibleStorage" }
    ActiveStorageInput:
      type: object
      required: [provider]
      properties:
        provider: { $ref: "#/components/schemas/StorageProvider" }
    StorageConfigInput:
      type: object
      description: >
        Fields used depend on the provider. R2: endpointUrl (account S3 endpoint), accessKeyId,
        secretAccessKey, bucketName, publicUrlPrefix. S3: region, accessKeyId, secretAccessKey,
        bucketName, endpointUrl (optional custom endpoint). Google Drive: customMcpEndpoint.
        Omitted secret fields keep the stored value.
      properties:
        endpointUrl: { type: ["string", "null"] }
        bucketName: { type: ["string", "null"] }
        region: { type: ["string", "null"] }
        publicUrlPrefix: { type: ["string", "null"] }
        accessKeyId: { type: ["string", "null"] }
        secretAccessKey: { type: ["string", "null"] }
        customMcpEndpoint: { type: ["string", "null"] }
